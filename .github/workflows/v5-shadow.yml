name: V5 prospective shadow signal

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: read

jobs:
  shadow-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install reproducible environment
        run: uv sync --frozen
      - name: Generate frozen V5 shadow signal
        run: uv run qqq-agents v5-shadow --through "$(date -u +%F)"
      - name: Preserve auditable signal
        uses: actions/upload-artifact@v4
        with:
          name: v5-shadow-${{ github.run_id }}
          path: artifacts/v5_shadow/signals/*.json
          retention-days: 90
